#same file as docker-compose.yml
# i prefered compose.yml

services:
  postgres_db:
    image: postgres:17-alpine
    container_name: sentinel_db
    ports:
      - "5432:5432"
    environment:
     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
     - POSTGRES_USER=${POSTGRES_USER}
     - POSTGRES_DB=${POSTGRES_DB}

    volumes:
      - sentinel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: sentinel_redis
    ports:
     - "6379:6379"

volumes:
  sentinel_postgres: